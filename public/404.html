<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Duta Kampus UIN Siber | The S.O.C.I.A.L Method</title>
  <script type="text/javascript">
    // SPA redirect trick for GitHub Pages
    // Saves the current path to sessionStorage and redirects to index.html
    var pathSegmentsToKeep = 1; // number of path segments in the repo name
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
